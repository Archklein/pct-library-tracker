<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCT Library Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>PCT Library Locator</h1>
            <p id="shelf-indicator">Scanning Shelf...</p>
        </header>

        <section id="search-page" class="view-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Enter book title...">
                <button id="search-btn">Search</button>
            </div>
        </section>

        <section id="results-page" class="view-section hidden">
            <button class="back-btn" id="back-to-search">← Back to Search</button>
            <h3>Search Results:</h3>
            <ul id="results-list"></ul>
        </section>

        <section id="map-page" class="view-section hidden">
            <button class="back-btn" id="back-to-results">← Back to Results</button>
            <h2 id="target-book-title">Book Title Here</h2>
            <p id="target-book-meta">Accession: ---</p>
            
            <div class="shelf-container">
                <div class="shelf-label">SHELF <span id="current-shelf-number">X</span></div>
                <div class="shelf-grid">
                    <div class="slot" data-slot="1">1</div>
                    <div class="slot" data-slot="5">5</div>
                    <div class="slot" data-slot="2">2</div>
                    <div class="slot" data-slot="6">6</div>
                    <div class="slot" data-slot="3">3</div>
                    <div class="slot" data-slot="7">7</div>
                    <div class="slot" data-slot="4">4</div>
                    <div class="slot" data-slot="8">8</div>
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
